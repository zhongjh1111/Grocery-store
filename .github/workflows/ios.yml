name: iOS Build & Test

on:
  push:
    paths:
      - 'pxvr-ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'pxvr-ios/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: pxvr-ios

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PXVR_KEYS_B64: ${{ secrets.PXVR_KEYS_B64 }}
      PXVR_VECTORS_B64: ${{ secrets.PXVR_VECTORS_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 注入密钥与测试向量（未配置 Secret 时跳过）
        if: env.PXVR_KEYS_B64 != ''
        run: |
          mkdir -p PXVR/Resources Tests/Resources
          echo "$PXVR_KEYS_B64" | base64 --decode > PXVR/Resources/PXVRKeys.json
          if [ -n "$PXVR_VECTORS_B64" ]; then
            echo "$PXVR_VECTORS_B64" | base64 --decode > Tests/Resources/testvectors.json
          fi
          echo "已写入 PXVRKeys.json（长度 $(wc -c < PXVR/Resources/PXVRKeys.json)）"
          ls Tests/Resources/ | head

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 列出可用模拟器
        run: xcrun simctl list devices available | head -40

      - name: 编译 + 跑测试
        run: |
          set +e
          xcodebuild test \
            -project PXVR.xcodeproj \
            -scheme PXVR \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES > build.log 2>&1
          STATUS=$?
          set -e

          if [ $STATUS -ne 0 ]; then
            echo "===== 编译/测试失败 ====="
            # 按文件聚合错误，每文件一条 annotation（annotation 每步上限 10 条）
            grep -E "error:" build.log | head -200 > errors.txt || true
            if [ -s errors.txt ]; then
              cut -d: -f1 errors.txt | sort -u | head -10 | while IFS= read -r f; do
                msgs=$(grep -F "$f:" errors.txt | head -3 \
                  | sed -E 's/^.*error: //' | tr '\n' ';' | cut -c1-600)
                echo "::error title=$(basename "$f")::$msgs"
              done
              echo "----- 全部错误 ($(wc -l < errors.txt)) -----"
              cat errors.txt
            else
              echo "::error title=xcodebuild::未匹配到 error: 行，见日志尾部"
            fi
            echo "----- 日志尾部 80 行 -----"
            tail -80 build.log
          else
            echo "构建与测试通过"
          fi

          cp build.log "${RUNNER_TEMP}/build.log" 2>/dev/null || true
          exit $STATUS

      - name: 总是上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: pxvr-ios/build.log
          if-no-files-found: ignore

      - name: 失败时上传结果包
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: pxvr-ios/TestResults.xcresult
          if-no-files-found: ignore

  # ---- 打包未签名 ipa（越狱机 + AppSync 直接装）----
  build-ipa:
    runs-on: macos-15
    needs: build-and-test
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 构建 PXVRUI（Release / 真机 / 不签名）
        run: |
          xcodebuild build \
            -project PXVR.xcodeproj \
            -scheme PXVRUI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: 打包成 ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PXVRUI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error title=打包::找不到 $APP_PATH"
            find build/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload PXVRUI-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # ad-hoc 签名 + 注入 entitlements。
          # 没有 application-identifier 会被 iOS 拒绝："Application is missing the application-identifier entitlement"
          codesign --force --sign - \
            --entitlements PXVRUI.entitlements \
            --timestamp=none \
            Payload/PXVRUI.app
          echo "----- 签名后的 entitlements -----"
          codesign -d --entitlements :- Payload/PXVRUI.app 2>/dev/null || true
          echo "----- 签名信息 -----"
          codesign -dv Payload/PXVRUI.app 2>&1 | head -8 || true
          zip -qry PXVRUI-unsigned.ipa Payload
          ls -lh PXVRUI-unsigned.ipa
          echo "二进制架构:"
          lipo -info Payload/PXVRUI.app/PXVRUI || true

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: PXVRUI-unsigned-ipa
          path: pxvr-ios/PXVRUI-unsigned.ipa
          if-no-files-found: error
