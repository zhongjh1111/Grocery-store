name: PXVR
options:
  bundleIdPrefix: net.ngee
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: PXVR/App/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: net.ngee.pixiver
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_OBJC_BRIDGING_HEADER: PXVR-iOS-Bridging-Header.h
    OTHER_LDFLAGS: "$(inherited) -lz"
targets:
  PXVR:
    type: application
    platform: iOS
    sources:
      - path: PXVR
        excludes:
          - "App/Info.plist"   # 由 info: 生成，若同时进 Resources 会触发 Multiple commands produce
      - path: PXVRApp.swift
      - path: PXVRConfig.swift
      - path: PXVRIntegrity.swift
      - path: PXVRNetwork.swift
      - path: PXVRStartup.swift
      - path: PXVRTransport.swift
      - path: PXVRWebView.swift
    info:
      path: PXVR/App/Info.plist
      properties:
        CFBundleDisplayName: PXVR
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSPhotoLibraryAddUsageDescription: "保存图片到相册"
        NSPhotoLibraryUsageDescription: "访问相册以保存图片"
        CFBundleURLTypes:
          - CFBundleURLName: net.ngee.pixiver
            CFBundleURLSchemes:
              - pxvr

  # ---- 独立 UI 壳（真机验证用，不含加密层）----
  PXVRUI:
    type: application
    platform: iOS
    sources:
      - path: PXVRUI
        excludes:
          - "Info.plist"
      # 桥 + 加密 + 网络（只取必要文件，不带整个 PXVR 目录，避免 @main 冲突）
      - path: PXVR/Web/PXVRWebBridge.swift
      - path: PXVR/Utils/PXVRProtocol.swift
      - path: PXVRConfig.swift
      - path: PXVRTransport.swift
      - path: PXVRNetwork.swift
      # 构建时注入的 p12 与密钥（CI 从 Secret 写入，xcodegen 前就位）
      - path: PXVRUI/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ngee.pixiver.ui
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    info:
      path: PXVRUI/Info.plist
      properties:
        CFBundleDisplayName: PXVR UI
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # ---- 单元测试（加密层验收）----
  PXVRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Info.plist"     # 仅作 INFOPLIST_FILE，不进 Resources
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.ngee.pixiver.tests
        GENERATE_INFOPLIST_FILE: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PXVR.app/PXVR"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: PXVR

schemes:
  PXVRUI:
    build:
      targets:
        PXVRUI: all
    run:
      config: Release
    archive:
      config: Release

  PXVR:
    build:
      targets:
        PXVR: all
        PXVRTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PXVRTests
